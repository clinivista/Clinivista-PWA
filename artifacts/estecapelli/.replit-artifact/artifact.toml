kind = "web"
previewPath = "/"
title = "Estecapelli PWA"
description = "PWA de preevaluación capilar para Estecapelli. Flujo móvil para que pacientes ingresen antecedentes y fotografías guiadas antes de la consulta médica. Incluye panel administrativo protegido por contraseña para que el equipo gestione leads, cree invitaciones por WhatsApp, clasifique casos con Norwood y coordine agendas."
version = "1.0.0"
id = "artifacts/estecapelli"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20214

[services.development]
run = "pnpm --filter @workspace/estecapelli run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/estecapelli", "run", "build" ]
serve = "static"
publicDir = "artifacts/estecapelli/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20214"
BASE_PATH = "/"
