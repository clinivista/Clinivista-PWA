openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Estecapelli API — Preevaluación capilar
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: leads
    description: Lead management (admin)
  - name: patients
    description: Patient pre-evaluation flow (public with token)
  - name: invitations
    description: Invitation links

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Check admin authentication status
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Staff login (email + password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOk"

  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: List leads (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of lead summaries
          content:
            application/json:
              schema:
                type: object
                required: [leads]
                properties:
                  leads:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/stats:
    get:
      operationId: getLeadStats
      tags: [leads]
      summary: Lead statistics (admin)
      responses:
        "200":
          description: Lead counts by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}:
    get:
      operationId: getLeadById
      tags: [leads]
      summary: Get lead detail (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead detail with photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead permanently (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOk"
        "403":
          description: Cannot delete (wrong status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchLead
      tags: [leads]
      summary: Update lead status, notes, norwood, appointment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatch"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/photos/{photoId}:
    get:
      operationId: getLeadPhotoFile
      tags: [leads]
      summary: Stream a clinical photo to an authorized staff session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private image stream
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /invitations:
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Create invitation link for patient (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers:
    get:
      operationId: getDirectorCenters
      tags: [director]
      summary: List every clinic with basic stats (director only)
      responses:
        "200":
          description: List of clinics
          content:
            application/json:
              schema:
                type: object
                required: [centers]
                properties:
                  centers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectorCenterSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createDirectorCenter
      tags: [director]
      summary: Create a new clinic with its staff accounts and, optionally, sample patients (director only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorCenterCreateBody"
      responses:
        "201":
          description: Clinic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorCenterSummary"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The clinic identifier or one of the emails is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers/{id}:
    patch:
      operationId: patchDirectorCenter
      tags: [director]
      summary: Suspend or reactivate a clinic (director only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorCenterPatch"
      responses:
        "200":
          description: Updated clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorCenterSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clinic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers/{id}/users:
    get:
      operationId: getDirectorCenterUsers
      tags: [director]
      summary: List the staff accounts of a clinic (director only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff accounts of the clinic
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectorCenterUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clinic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createDirectorCenterUser
      tags: [director]
      summary: Create a médico or administrativo account in an existing clinic (director only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorCenterCreateUser"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorCenterUser"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clinic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers/{id}/users/{userId}/reset-password:
    post:
      operationId: resetDirectorCenterUserPassword
      tags: [director]
      summary: Reset a clinic user's password to a generated temporary one, shown once (director only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Password reset; the temporary password is returned only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorPasswordReset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found in that clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers/{id}/users/{userId}:
    patch:
      operationId: patchDirectorCenterUser
      tags: [director]
      summary: Block or unblock one clinic user's access (director only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorCenterUserPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorCenterUser"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found in that clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/team:
    get:
      operationId: getDirectorTeam
      tags: [director]
      summary: List the supra-control team - directors and administrators (director only)
      responses:
        "200":
          description: Supra-control team
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectorTeamMember"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createDirectorTeamMember
      tags: [director]
      summary: Create a supra-control administrator (director only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorTeamCreateBody"
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorTeamMember"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/team/{userId}:
    patch:
      operationId: patchDirectorTeamMember
      tags: [director]
      summary: Block or unblock a supra-control administrator (director only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorUserPatch"
      responses:
        "200":
          description: Updated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorTeamMember"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Administrator not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/team/{userId}/reset-password:
    post:
      operationId: resetDirectorTeamMemberPassword
      tags: [director]
      summary: Reset a supra-control administrator's password to a generated temporary one, shown once (director only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Password reset; the temporary password is returned only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorPasswordReset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Administrator not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers/{id}/identity:
    put:
      operationId: updateDirectorCenterIdentity
      tags: [director]
      summary: Set the name and logo patients see for a clinic (director or supra-control administrator)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorCenterIdentityBody"
      responses:
        "200":
          description: Updated clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorCenterSummary"
        "400":
          description: Invalid name or logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a supra-control account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clinic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers/{id}/payments:
    post:
      operationId: recordDirectorCenterPayment
      tags: [director]
      summary: Manually record that a clinic has paid through a given date (director only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorCenterPaymentBody"
      responses:
        "200":
          description: Updated clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorCenterSummary"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clinic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /director/centers/{id}/export:
    get:
      operationId: getDirectorCenterExport
      tags: [director]
      summary: Export all of a clinic's patient records as a JSON file (director only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JSON export file
          content:
            application/json: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a director account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clinic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients:
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient pre-evaluation (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResult"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clinics/{slug}:
    get:
      operationId: getClinic
      tags: [patients]
      summary: Name and logo of a clinic, by its public address (public)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clinic identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinic"
        "404":
          description: No clinic with that address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clinics/{slug}/patients:
    post:
      operationId: createClinicPatient
      tags: [patients]
      summary: Create a patient pre-evaluation in the clinic with this public address (public)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResult"
        "403":
          description: The clinic is not accepting new evaluations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No clinic with that address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clinic/users:
    get:
      operationId: getClinicUsers
      tags: [clinic-users]
      summary: Users of the signed-in clinic (administrativos and the legal representative only)
      responses:
        "200":
          description: The clinic's users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicUserList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed to manage users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createClinicUser
      tags: [clinic-users]
      summary: Create a médico or administrativo in the signed-in clinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicUserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicUser"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed to manage users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clinic/users/{userId}:
    patch:
      operationId: patchClinicUser
      tags: [clinic-users]
      summary: Block/unblock a user or set the legal representative
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicUserPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicUser"
        "400":
          description: Invalid or not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed to manage users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found in this clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClinicUser
      tags: [clinic-users]
      summary: Permanently delete a user of the signed-in clinic
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Not allowed (yourself or the last administrator)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed to manage users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found in this clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clinic/users/{userId}/reset-password:
    post:
      operationId: resetClinicUserPassword
      tags: [clinic-users]
      summary: Generate a temporary password for a user of the signed-in clinic
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Temporary password, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorPasswordReset"
        "400":
          description: Not allowed (yourself)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed to manage users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found in this clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clinic/me:
    get:
      operationId: getMyClinic
      tags: [leads]
      summary: The signed-in staff member's own clinic, with the address patients use to register
      responses:
        "200":
          description: The clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyClinic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a clinic account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clinic/protocol:
    get:
      operationId: getClinicProtocol
      tags: [clinic-protocol]
      summary: Phases and photos configured for the signed-in clinic
      responses:
        "200":
          description: The clinic's phase structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicProtocol"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateClinicProtocol
      tags: [clinic-protocol]
      summary: Replace the clinic's phases and photos (legal representative only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicProtocolUpdate"
      responses:
        "200":
          description: The saved structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicProtocol"
        "400":
          description: Invalid structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the legal representative can edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}/protocol:
    get:
      operationId: getPatientProtocol
      tags: [patients]
      summary: Photos the patient must take in the pre-evaluation (public, by token)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pre-evaluation photo list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProtocol"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}/clinic:
    get:
      operationId: getPatientClinic
      tags: [patients]
      summary: Name and logo of the clinic that invited this patient (public, by token)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clinic identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinic"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient pre-evaluation by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Patient summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient pre-evaluation by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResult"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}/photos:
    get:
      operationId: getPatientPhotoStatus
      tags: [patients]
      summary: List private clinical photo metadata for the token holder
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Photo state without image bytes or object URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPhotoStatusResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadPatientPhoto
      tags: [patients]
      summary: Upload a private original clinical photo for the token holder
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: x-photo-key
          in: header
          required: true
          schema:
            type: string
        - name: x-photo-source
          in: header
          required: true
          schema:
            type: string
            enum: [camera, upload]
        - name: x-photo-width
          in: header
          schema:
            type: string
        - name: x-photo-height
          in: header
          schema:
            type: string
        - name: x-photo-metadata
          in: header
          description: JSON with non-clinical capture and technical review metadata
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Draft original stored privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPhotoStatus"
        "400":
          description: Invalid photo input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: discardPatientPhotos
      tags: [patients]
      summary: Discard all draft photos for a patient pre-evaluation (public, token-authorized)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Draft photos discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}/photos/{photoId}/confirm:
    post:
      operationId: confirmPatientPhoto
      tags: [patients]
      summary: Confirm a draft clinical photo for the token holder
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoConfirmation"
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmed photo metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPhotoStatus"
        "404":
          description: Draft photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}/photos/{photoId}/adjusted:
    post:
      operationId: createPatientAdjustedPhoto
      tags: [patients]
      summary: Save a validated technical derivative while preserving the private original
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
        - name: x-edit-params
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Technical derivative stored privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPhotoStatus"
        "400":
          description: Technical parameters or derivative exceed safe limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: discardPatientAdjustedPhoto
      tags: [patients]
      summary: Discard only a technical derivative; the original remains protected
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Technical derivative discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOk"
        "404":
          description: Technical derivative not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getPatientAdjustedPhotoFile
      tags: [patients]
      summary: Stream the server-rendered technical derivative for patient review
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-rendered private technical derivative stream
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Technical derivative not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}/photos/{photoId}/original:
    get:
      operationId: getPatientOriginalPhotoFile
      tags: [patients]
      summary: Stream the protected original for the token holder's local technical editor
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Original private image stream
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Original photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{token}/photos/{photoId}:
    delete:
      operationId: discardPatientPhoto
      tags: [patients]
      summary: Discard one draft or superseded clinical photo for the token holder
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Draft photo discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOk"
        "404":
          description: Draft photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SimpleOk:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    AuthStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required: [id, email, name, role, centerId]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [medico, administrativo, director, supra_admin]
        centerId:
          type: string
          nullable: true
          description: null only for "director" and "supra_admin" accounts, which are not tied to one clinic.
        canManageUsers:
          type: boolean
          description: true for a clinic's administrativos and its legal representative (even a médico), who manage the clinic's users.

    DirectorCenterSummary:
      type: object
      required: [id, name, slug, active, createdAt, patientCount, staffCount, paidUntil, paymentStatus, logoDataUrl]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        patientCount:
          type: number
        staffCount:
          type: number
        paidUntil:
          type: string
          format: date-time
          nullable: true
          description: Manually recorded — the clinic is considered paid through this date. Null if a director has never recorded a payment.
        paymentStatus:
          type: string
          enum: [al_dia, atrasada, sin_registro]
        logoDataUrl:
          type: string
          nullable: true
          description: The clinic's logo as shown to its patients (PNG data URL). Null if none has been uploaded.

    DirectorCenterIdentityBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Name patients see (3 to 80 characters).
        slug:
          type: string
          description: Public address of the clinic, app.../c/{slug} (lowercase letters, digits and hyphens, 3 to 40 characters). Omit to keep the current one. Changing it breaks links already shared.
        logoDataUrl:
          type: string
          nullable: true
          description: A PNG, JPEG or WebP data URL (up to about 300 KB). Omit to keep the current logo; null removes it. The server re-encodes it to a PNG of at most 256 px.

    MyClinic:
      type: object
      required: [name, slug, logoDataUrl]
      properties:
        name:
          type: string
        slug:
          type: string
        logoDataUrl:
          type: string
          nullable: true

    ClinicProtocolView:
      type: object
      required: [id, key, label, position, hasPhotos]
      properties:
        id: {type: string}
        key: {type: string}
        label: {type: string}
        position: {type: number}
        hasPhotos: {type: boolean}

    ClinicProtocolPhase:
      type: object
      required: [id, key, name, position, patientCaptured, views]
      properties:
        id: {type: string}
        key: {type: string}
        name: {type: string}
        position: {type: number}
        patientCaptured: {type: boolean}
        views:
          type: array
          items:
            $ref: "#/components/schemas/ClinicProtocolView"

    ClinicProtocol:
      type: object
      required: [canEdit, phases]
      properties:
        canEdit: {type: boolean}
        phases:
          type: array
          items:
            $ref: "#/components/schemas/ClinicProtocolPhase"

    ClinicProtocolViewInput:
      type: object
      required: [label]
      properties:
        id: {type: string}
        label: {type: string}

    ClinicProtocolPhaseInput:
      type: object
      required: [name, views]
      properties:
        id: {type: string}
        name: {type: string}
        views:
          type: array
          items:
            $ref: "#/components/schemas/ClinicProtocolViewInput"

    ClinicProtocolUpdate:
      type: object
      required: [phases]
      properties:
        phases:
          type: array
          items:
            $ref: "#/components/schemas/ClinicProtocolPhaseInput"

    PatientProtocolView:
      type: object
      required: [key, label, required]
      properties:
        key: {type: string}
        label: {type: string}
        required: {type: boolean}

    PatientProtocol:
      type: object
      required: [phaseName, views]
      properties:
        phaseName: {type: string}
        views:
          type: array
          items:
            $ref: "#/components/schemas/PatientProtocolView"

    PatientClinic:
      type: object
      required: [name, logoDataUrl]
      properties:
        name:
          type: string
        logoDataUrl:
          type: string
          nullable: true

    DirectorCenterPatch:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    ClinicUser:
      type: object
      required: [id, email, name, role, active, legalRepresentative, isSelf, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [medico, administrativo]
        active:
          type: boolean
        legalRepresentative:
          type: boolean
        isSelf:
          type: boolean
          description: true for the signed-in user's own row (it can't be blocked, deleted or reset here).
        createdAt:
          type: string
          format: date-time

    ClinicUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ClinicUser"

    ClinicUserCreate:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [medico, administrativo]
        legalRepresentative:
          type: boolean

    ClinicUserPatch:
      type: object
      properties:
        active:
          type: boolean
          description: false blocks the user's access (and closes their open sessions); true restores it.
        legalRepresentative:
          type: boolean

    DirectorCenterUser:
      type: object
      required: [id, email, name, role, active, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [medico, administrativo]
        active:
          type: boolean
        legalRepresentative:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DirectorCenterUserPatch:
      type: object
      properties:
        active:
          type: boolean
          description: false blocks the user's access (and closes their open sessions); true restores it.
        legalRepresentative:
          type: boolean
          description: Marks or unmarks the clinic's legal representative (who may manage the clinic's users).

    DirectorUserPatch:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          description: false blocks the user's access (and closes their open sessions); true restores it.

    DirectorTeamMember:
      type: object
      required: [id, email, name, role, active, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [director, supra_admin]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DirectorTeamCreateBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
          description: At least 8 characters. Never stored in plain text.

    DirectorPasswordReset:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          description: Generated password, shown only once. The user's open sessions are closed.

    DirectorCenterCreateBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name of the clinic.
        slug:
          type: string
          description: Optional identifier (lowercase letters, digits and hyphens). Derived from the name when omitted.
        users:
          type: array
          description: Initial staff accounts for the clinic (up to 5).
          items:
            $ref: "#/components/schemas/DirectorCenterCreateUser"
        withSamplePatients:
          type: boolean
          description: Also load a few fictitious demo patients (no photos).

    DirectorCenterCreateUser:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
          description: At least 8 characters. Never stored in plain text.
        role:
          type: string
          enum: [medico, administrativo]
        legalRepresentative:
          type: boolean

    DirectorCenterPaymentBody:
      type: object
      required: [paidUntil]
      properties:
        paidUntil:
          type: string
          format: date-time
          description: The clinic is considered paid through this date.

    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [ok, user]
      properties:
        ok:
          type: boolean
        user:
          $ref: "#/components/schemas/AuthUser"

    PhotoEntry:
      type: object
      required: [key, label, dataUrl, quality, createdAt]
      properties:
        key:
          type: string
        label:
          type: string
        dataUrl:
          type: string
        quality:
          type: string
        createdAt:
          type: string

    PatientPhotoStatus:
      type: object
      required: [id, key, label, status, source, mimeType, sizeBytes, sha256, createdAt, hasOriginal, hasAdjusted]
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [draft, confirmed, superseded, discarded]
        source:
          type: string
          enum: [camera, upload]
        mimeType:
          type: string
        sizeBytes:
          type: number
        sha256:
          type: string
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: ["string", "null"]
          format: date-time
        hasOriginal:
          type: boolean
        hasAdjusted:
          type: boolean
        width:
          type: ["number", "null"]
        height:
          type: ["number", "null"]
        captureMetadata: {}
        note:
          type: ["string", "null"]
          description: Optional description the patient wrote for this photo
        editParams: {}

    PhotoConfirmation:
      type: object
      properties:
        note:
          type: ["string", "null"]
          maxLength: 500

    PatientPhotoStatusResult:
      type: object
      required: [ok, photos]
      properties:
        ok:
          type: boolean
        photos:
          type: array
          items:
            $ref: "#/components/schemas/PatientPhotoStatus"

    LeadStatus:
      type: string
      enum: [nuevo, incompleto, listo, contactar, agendado, cerrado]

    LeadSummary:
      type: object
      required: [id, token, createdAt, updatedAt, name, phone, status, photoCount]
      properties:
        id:
          type: string
        token:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        name:
          type: string
        phone:
          type: string
        documentId:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        age:
